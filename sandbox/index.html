<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Compresión de Imágenes - Enote</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { color: #7A3045; margin-bottom: 20px; }
        .test-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .result-box { background: #f0f0f0; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
        .comparison { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .image-card { text-align: center; }
        .image-card img { max-width: 100%; border: 1px solid #ccc; }
        .image-card h3 { margin: 10px 0; }
        .image-card p { font-size: 14px; color: #666; }
        #log { background: #1e1e1e; color: #0f0; padding: 15px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
        button { background: #7A3045; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #5a2333; }
    </style>
</head>
<body>
    <h1>🖼️ Test Compresión de Imágenes - Enote Sandbox</h1>

    <div class="test-section">
        <h2>📤 Subir Imágenes (Máx 5)</h2>
        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(this)">
        <p style="font-size: 12px; color: #666; margin-top: 5px;">Las imágenes se comprimirán automáticamente al subirse</p>
        <div id="uploadedCount" style="margin-top: 10px; font-weight: bold; color: #7A3045;">Imágenes: 0/5</div>
        <br>
        <button onclick="runTest()">▶ Ejecutar Test (Referencia)</button>
        <button onclick="clearLog()">🗑️ Limpiar Log</button>
        <button onclick="downloadLog()">💾 Descargar Log</button>
        <button onclick="clearMemory()" style="background: #666;">♻️ Limpiar Imágenes</button>
    </div>

    <div class="test-section">
        <h2>📋 Log de Resultados</h2>
        <div id="log" class="result-box"></div>
    </div>

    <div class="test-section">
        <h2>📊 Comparación Visual (Imágenes Subidas)</h2>
        <div id="comparisonsContainer"></div>
    </div>

    <script src="image-compress.js"></script>
</body>
</html>
