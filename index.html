<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Enote — Sistema de gestión de notas de remisión para Xiera">
  <title>Enote — Xiera</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="manifest" href="manifest.json">
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Enote">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="theme-color" content="#7A3045">
</head>
<body>
  <div id="app">
    <div id="loading" aria-busy="true" aria-live="polite">Cargando Enote...</div>
  </div>
  <script>
    // SW controllerchange: recargar cuando nuevo SW tome control.
    // Este listener corre incluso si app.js (module) falla — cubre boot-fail recovery.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (sessionStorage.getItem('_sw_reloading')) return;
        sessionStorage.setItem('_sw_reloading', '1');
        window.location.reload();
      });
    }
    window.__bootFailsafe = setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.setAttribute('aria-busy', 'false');
      el.textContent = 'No se pudo cargar Enote. Revisa tu conexión y recarga.';
      el.style.cursor = 'pointer';
      el.addEventListener('click', function () { location.reload(); });
    }, 8000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
